name: curved_toggle_tabs
description: A customizable Flutter widget that provides smooth S-curve folder-style toggle tabs with animated transitions between views.
version: 0.0.2

homepage: https://github.com/PhooPwintSone/curved_toggle_tabs
repository: https://github.com/PhooPwintSone/curved_toggle_tabs

screenshots:
  - description: "Curve Toggle Tabs showing the active Log In tab"
    path: screenshots/login_tab.png
  - description: "Curve Toggle Tabs smoothly transitioned to the Sign Up tab"
    path: screenshots/signup_tab.png

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
